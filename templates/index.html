<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>jdoc.cc | URL Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <!-- 💡 Wider container for visibility -->
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-3xl">
    <h1 class="text-2xl font-semibold mb-6 text-gray-800 text-center">jdoc.cc</h1>

    {% if not authenticated %}
      <div class="text-center">
        <a href="/login"
           class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md">
          Sign in with Google
        </a>
      </div>
    {% else %}
      <p class="text-gray-600 mb-4 text-center">Signed in as {{ email }}</p>

      <!-- URL Shorten Form -->
      <form id="shorten-form" class="space-y-4">
        <input name="url" type="url" placeholder="Enter long URL"
               class="w-full border px-3 py-2 rounded-md focus:ring focus:ring-blue-200" required>
        <input name="slug" placeholder="Custom alias (optional)"
               class="w-full border px-3 py-2 rounded-md focus:ring focus:ring-blue-200">
        <button type="submit"
                class="w-full bg-blue-500 text-white font-medium py-2 rounded-md hover:bg-blue-600">
          Shorten
        </button>
      </form>

      <p id="result" class="text-green-600 mt-3 text-center"></p>

      <!-- 🔗 User Links Table -->
      <div id="links-container" class="mt-8 hidden">
        <h2 class="text-lg font-semibold text-gray-700 mb-3 text-left">Your Links</h2>

        <!-- Scrollable Table Wrapper (vertical only) -->
        <div class="max-h-64 overflow-y-auto overflow-x-hidden border rounded-md">
          <table class="w-full border-collapse text-sm text-left table-fixed">
            <thead class="sticky top-0 bg-gray-100">
              <tr class="border-b">
                <th class="py-2 px-2 w-32">Short</th>
                <th class="py-2 px-2 w-64">Original</th>
                <th class="py-2 px-2 w-10 text-right">Clicks</th>
                <th class="py-2 px-2 w-32 text-right">Created</th>
                <th class="py-2 px-2 w-20 text-right">Delete</th>
              </tr>
            </thead>
            <tbody id="links-table"></tbody>
          </table>
        </div>
      </div>

      <a href="/logout" class="text-gray-400 text-sm block mt-6 text-center hover:text-gray-500">
        Logout
      </a>
    {% endif %}
  </div>

  <script>
    const form = document.getElementById("shorten-form");
    const result = document.getElementById("result");
    const linksContainer = document.getElementById("links-container");
    const linksTable = document.getElementById("links-table");

    // Load user links and display in table
    async function loadLinks() {
      const res = await fetch("/my/links");
      if (!res.ok) return;
      const links = await res.json();

      if (links.length === 0) {
        linksContainer.classList.add("hidden");
        return;
      }

      linksContainer.classList.remove("hidden");
      linksTable.innerHTML = links.map(l => `
          <tr class="border-b hover:bg-gray-50 align-top">
            <td class="py-2 px-2 text-blue-600 break-words whitespace-normal">
              <a href="${l.short_url}" target="_blank">${l.short_url.replace('https://', '')}</a>
            </td>
            <td class="py-2 px-2 text-gray-700 break-words whitespace-normal">
              <a href="${l.target}" target="_blank" class="hover:text-blue-500">${l.target}</a>
            </td>
            <td class="py-2 px-2 text-right text-gray-500">${l.clicks}</td>
            <td class="py-2 px-2 text-right text-gray-500">${l.created_at}</td>
            <td class="py-2 px-2 text-right">
              <button onclick="deleteLink('${l.slug}')"
                      class="text-red-500 hover:text-red-700 font-semibold">✕</button>
            </td>
          </tr>
      `).join('');
    }

    // Delete link handler
    async function deleteLink(slug) {
      if (!confirm("Are you sure you want to delete this link?")) return;
      const res = await fetch(`/delete/${slug}`, { method: "DELETE" });
      if (res.ok) {
        loadLinks();
      } else {
        alert("Error deleting link");
      }
    }

    // Form submission handler
    if (form) {
      form.addEventListener("submit", async e => {
        e.preventDefault();
        const data = new FormData(form);
        const res = await fetch("/shorten", { method: "POST", body: data });
        const json = await res.json();

        if (json.short_url) {
          result.innerText = json.short_url;
          result.classList.remove("text-red-600");
          loadLinks();
        } else {
          result.innerText = json.error || "Error shortening link";
          result.classList.add("text-red-600");
        }
      });

      loadLinks();
    }
  </script>
</body>
</html>
